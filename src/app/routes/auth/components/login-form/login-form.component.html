  <section class="c-login-area">
    <span>Gestão de Estágio</span>
  
    <section class="c-login">
      <form class="c-login__form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <app-input-field
          formControlName="email"
          [label]="'Endereço de e-mail'"
          [type]="'email'"
          [placeholder]="'Digite seu endereço de e-mail aqui'"
        ></app-input-field>

        <app-input-field
          formControlName="password"
          [label]="'Senha'"
          [type]="'password'"
          [placeholder]="'Digite sua senha aqui'"
        ></app-input-field>

        <span *ngIf="!formDataValid">E-mail ou senha incorretos</span>

        <button 
          class="c-login__login-button" 
          [ngClass]="{'c-login__login-button--activated': isLoading }"
          [disabled]="isLoading" 
          type="submit"
        >
          <mat-progress-spinner diameter=20 mode="indeterminate" *ngIf="isLoading"></mat-progress-spinner>
          <b *ngIf="!isLoading">Entrar</b>
        </button>
        
        <a 
          class="c-login__register-button"
          [routerLink]="['../registro']"
        >
          <b>Criar conta</b>
        </a>
      </form>
    </section>
  </section>
