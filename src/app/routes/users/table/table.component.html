</div>
<div class="c-users-container">

  <!-- Header -->
  <div class="c-users-header">
    <!-- Actions -->
    <div class="c-users-header__actions">
        <div class="c-users-header__search">
          <span class="c-users-header__search-icon">
            <mat-icon svgIcon="search" aria-hidden="false"></mat-icon>
          </span>
          <input
            [(ngModel)]="searchText"
            type="text"
            class="c-users-header__search-input"
            placeholder="Procurar..."
            (keyup.enter)="searchTextFilter()"
            (ngModelChange)="searchTextFilter()"
          />
          <span class="clear-filter" (click)="clearFilter()" *ngIf="!isFilterEmpty()">
            <mat-icon svgIcon="close" aria-hidden="false"></mat-icon>
          </span>
        </div>
        <button
          class="c-users-header__search-filter"
          (click)="openFilterDialog()"
          style="margin-left: 12px;"
        >
          <mat-icon svgIcon="filter" aria-hidden="false"></mat-icon>
          <span>Filtrar</span>
        </button>
    </div>
  </div>

  <!-- Lista de requisicoes -->
  <section class="c-users-list">
    <header class="c-users-list__header">
    </header>

    <div class="loading-overlay" *ngIf="isLoading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="text-overlay" *ngIf="users.length === 0 && !isLoading">
      <div class="content">
        <span>Nenhum Aluno Encontrado</span>
        <!-- <mat-icon svgIcon="exclamation" aria-hidden="false"></mat-icon> -->
      </div>
    </div>

    <div class="table-container" [ngStyle]="{'opacity' : isLoading ? 0.5 : 1}">
      <table
        mat-table
        [dataSource]="dataSource"
        class="c-users-list__table mat-elevation-z8"
        matSort
        (matSortChange)="handleSortChange($event)"
      >

        <!-- name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-users-list__header-cell">
            Nome
          </th>
          <td mat-cell *matCellDef="let user" class="c-users-list__cell">
            {{ user.name }}
          </td>
        </ng-container>

        <!-- studentNumber Column -->
        <ng-container matColumnDef="studentNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-users-list__header-cell">
            Matrícula
          </th>
          <td mat-cell *matCellDef="let user" class="c-users-list__cell">
            {{ user.studentNumber }}
          </td>
        </ng-container>

        <!-- email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-users-list__header-cell">
            E-Mail
          </th>
          <td mat-cell *matCellDef="let user" class="c-users-list__cell">
            {{ user.email }}
          </td>
        </ng-container>

        <!-- course Column -->
        <ng-container matColumnDef="course">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-users-list__header-cell">
            Curso
          </th>
          <td mat-cell *matCellDef="let user" class="c-users-list__cell">
           {{ user.course.name ?? 'Sem Dados' }}
          </td>
        </ng-container>

        <!-- actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef sticky class="c-users-list__header-cell">
            Ação
          </th>
          <td mat-cell *matCellDef="let user" class="c-users-list__cell">
            <app-actions-menu
              [userId]="user.id"
              (updateData)="updateData()"
            ></app-actions-menu>
          </td>
        </ng-container>

        <!-- Header and Row Declarations -->
        <tr mat-header-row class="c-users-list__header-row"  *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row class="c-users-list__row" *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>
  </section>


  <!-- Footer -->
  <footer class="c-users-footer">
    <mat-paginator *ngIf="users.length > 0"
      [pageSize]="perPage"
      [pageSizeOptions]="[10, 20, 30]"
      [length]="total"
      (page)="onPageChange($event)"
      showFirstLastButtons
    >
    </mat-paginator>

  </footer>

</div>
