<div class="c-vacancies-container">

  <!-- Header -->
  <div class="c-vacancies-header">
    <!-- Actions -->
    <div class="c-vacancies-header__actions">
      @if(userService.getUser().role.name === 'Administrador') {
        <button 
          [routerLink]="[MODULES['criar-vaga'].route]"
          style="margin-left: 12px;" 
          class="action-btn"
        >
          Cadastrar Vaga
          <mat-icon svgIcon="add" aria-hidden="false"></mat-icon>
        </button>
      } @else {
        <div></div>
      }
      <div style="display: flex;">
        <!-- <div class="c-vacancies-header__search">
          <span class="c-vacancies-header__search-icon">
            <mat-icon svgIcon="search" aria-hidden="false"></mat-icon>
          </span>
          <input
            [(ngModel)]="searchText"
            type="text"
            class="c-vacancies-header__search-input"
            placeholder="Procurar..."
            (keyup.enter)="searchTextFilter()"
          />
          <span class="clear-filter" (click)="clearFilter()" *ngIf="!isFilterEmpty()">
            <mat-icon svgIcon="close" aria-hidden="false"></mat-icon>
          </span>
        </div>
        <button
          class="c-vacancies-header__search-filter"
          (click)="openFilterDialog()"
          style="margin-left: 12px;"
        >
          <mat-icon svgIcon="filter" aria-hidden="false"></mat-icon>
          <span>Filtrar</span>
        </button> -->
      </div>
    </div>
  </div>

  <!-- Lista de requisicoes -->
  <section class="c-vacancies-list">
    <header class="c-vacancies-list__header">
    </header>

    <div class="loading-overlay" *ngIf="isLoading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div class="text-overlay" *ngIf="vacancies.length === 0 && !isLoading">
      <div class="content">
        <span>Nenhuma Vaga Encontrada</span>
        <!-- <mat-icon svgIcon="exclamation" aria-hidden="false"></mat-icon> -->
      </div>
    </div>

    <div class="table-container" [ngStyle]="{'opacity' : isLoading ? 0.5 : 1}">
      <table
        mat-table
        [dataSource]="dataSource"
        class="c-vacancies-list__table mat-elevation-z8"
        matSort
        (matSortChange)="handleSortChange($event)"
      >

        <!-- title Column -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-vacancies-list__header-cell">
            Título
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            {{ vacance.title }}
          </td>
        </ng-container>

        <!-- description Column -->
        <!-- <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-vacancies-list__header-cell">
            Descrição
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            {{ vacance.description }}
          </td>
        </ng-container> -->

        <!-- number of positions Column -->
        <ng-container matColumnDef="numberOfPositions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-vacancies-list__header-cell">
            N° Vagas
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            {{ vacance.numberOfPositions }}
          </td>
        </ng-container>

        <!-- salary Column -->
        <ng-container matColumnDef="salary">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-vacancies-list__header-cell">
            Salário
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            R${{ vacance.salary ?? 'Sem Dados' }}
          </td>
        </ng-container>

        <!-- application deadline Column -->
        <ng-container matColumnDef="applicationDeadline">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-vacancies-list__header-cell">
            Válido até
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            {{ vacance.applicationDeadline }}
          </td>
        </ng-container>

        <!-- actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-internships-list__header-cell">
            Ação
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            <app-actions-menu
              [vacancyId]="vacance.id"
            ></app-actions-menu>
          </td>
        </ng-container>

        <!-- options -->
        <!-- <ng-container matColumnDef="options"> -->
          <!-- <th mat-header-cell *matHeaderCellDef mat-sort-header sticky class="c-vacancies-list__header-cell">
            Opções
          </th>
          <td mat-cell *matCellDef="let vacance" class="c-vacancies-list__cell">
            <button class="action-btn">
              Aplicar
            </button>
          </td> -->
        <!-- </ng-container> -->



        <!-- Header and Row Declarations -->
        <tr mat-header-row class="c-vacancies-list__header-row"  *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row class="c-vacancies-list__row" *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>


    </div>
  </section>


  <!-- Footer -->
  <footer class="c-vacancies-footer">
    <mat-paginator *ngIf="vacancies.length > 0"
      [pageSize]="perPage"
      [pageSizeOptions]="[10, 20, 30]"
      [length]="total"
      (page)="onPageChange($event)"
      showFirstLastButtons
    >
    </mat-paginator>

  </footer>

</div>
