<div
  class="c-field-box"
  [ngClass]="{ 
    'c-field-box--disabled': disabled || readOnly, 
    'c-field-box--with-error': validateField() !== null
  }"
  [ngStyle]="{ height: textArea ? 'auto' : height }"
>
  @if (label) {
  <label
    class="c-field-box__label"
    [ngClass]="{ 'c-field-box__label--disabled': disabled || readOnly }"
    [ngStyle]="labelColor !== '' ? {'background-color': labelColor} : {}"
  >{{ label }}</label>
  }

  <textarea 
    *ngIf="textArea"
    class="c-field-box__input c-field-box__input-text-area"
    #input
    [readOnly]="readOnly"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    (keyup)="onInputChange($event)"
    [disabled]="disabled"
  ></textarea>
  <input
    *ngIf="!textArea"
    class="c-field-box__input"
    #input
    [type]="type"
    [readOnly]="readOnly"
    [placeholder]="placeholder"
    [min]="min"
    [max]="max"
    [(ngModel)]="value"
    (keyup)="onInputChange($event)"
    [disabled]="disabled"
  />

  
  <span
  class="c-field-box__error-message"
  [ngStyle]="{'display': !validateField() ? 'none' : 'flex'}" >
    {{ validateField() }}
  </span>
</div>
